<title>Sitefellow · beta</title>
<meta name="description" content="Sitefellow is a beta tool for people who build together: one timeline for phases, tasks, decisions, rooms and conversations.">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161614" media="(prefers-color-scheme: dark)">

<style>
  :root {
    --paper: #f4f1ea; --paper-deep: #e9e3d6; --ink: #1c1b19; --graphite: #6b675f;
    --rule: #dcd7cc; --pencil: #a8a196; --ember: #b04f33; --moss: #4f5d45;
    --serif: "Instrument Serif", Georgia, serif;
    --sans: "Instrument Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #161614; --paper-deep: #22211e; --ink: #ece8df; --graphite: #9a958b;
      --rule: #2e2d2a; --pencil: #5c5850; --ember: #e07a5c; --moss: #a3b394;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 25px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; text-underline-offset: 4px; text-decoration-color: var(--rule); }
  a:hover { text-decoration-color: var(--ember); }

  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 0 16px; }
  .brand { display: flex; align-items: baseline; gap: 12px; text-decoration: none; }
  .brand b { font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1; }
  .label { font-family: var(--mono); font-size: 12px; line-height: 16px; letter-spacing: .12em; text-transform: uppercase; color: var(--graphite); }
  .back { font-size: 14px; color: var(--graphite); display: flex; align-items: center; gap: 8px; text-decoration: none; }
  .back svg { width: 18px; height: 18px; }

  .project { padding: 24px 0 8px; }
  .project h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(40px, 9vw, 64px); line-height: 1; letter-spacing: -.01em; cursor: text; outline: none; }
  .project h1 em { color: var(--graphite); }
  .project .sub { margin-top: 12px; color: var(--graphite); cursor: text; outline: none; }
  .project h1:focus-visible, .project .sub:focus-visible { box-shadow: 0 2px 0 var(--ember); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin: 32px 0 0; }
  .stat { padding: 16px 16px 16px 0; }
  .stat + .stat { padding-left: 16px; border-left: 1px solid var(--rule); }
  .stat .v { font-family: var(--serif); font-style: italic; font-size: 40px; line-height: 1; }
  .stat .v.warn { color: var(--ember); }
  .stat .k { margin-top: 8px; }
  @media (max-width: 560px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .stat:nth-child(3) { padding-left: 0; border-left: 0; }
    .stat:nth-child(n+3) { border-top: 1px solid var(--rule); }
  }

  nav.tabs { display: flex; gap: 24px; overflow-x: auto; margin-top: 32px; border-bottom: 1px solid var(--rule); scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { background: none; border: 0; padding: 12px 0; cursor: pointer; color: var(--graphite); white-space: nowrap; position: relative; }
  nav.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 500; }
  nav.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }
  nav.tabs .count { font-family: var(--mono); font-size: 12px; color: var(--graphite); margin-left: 4px; }

  .panel { padding: 32px 0 72px; }
  .panel-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .panel-head h2 { font-family: var(--serif); font-weight: 400; font-size: 36px; line-height: 1.12; }
  .panel-head h2 em { color: var(--graphite); }

  .btn { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); border-radius: 4px; padding: 8px 16px; cursor: pointer; font-size: 15px; line-height: 22px; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
  .btn.ghost:hover { border-color: var(--ink); }
  .btn.danger { background: transparent; color: var(--ember); border-color: var(--ember); }
  .btn:focus-visible, nav.tabs button:focus-visible, .bar:focus-visible, .row-btn:focus-visible, .room:focus-visible, button.tl-phase:focus-visible, footer button:focus-visible, .toast button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

  /* Timeline */
  .tl { overflow-x: auto; border-top: 1px solid var(--rule); -webkit-overflow-scrolling: touch; }
  .tl-inner { position: relative; min-width: 100%; }
  .tl-scale { display: flex; position: sticky; top: 0; height: 32px; border-bottom: 1px solid var(--rule); }
  .tl-week { flex: none; font-family: var(--mono); font-size: 11px; color: var(--graphite); padding: 8px 0 0 6px; border-left: 1px solid var(--rule); overflow: hidden; white-space: nowrap; }
  .tl-phase { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--graphite); padding: 20px 0 8px; position: sticky; left: 0; width: max-content; }
  .tl-row { position: relative; height: 44px; }
  .bar { position: absolute; top: 6px; height: 32px; border-radius: 0; border: 1px solid var(--ink); background: var(--paper-deep); color: var(--ink); display: flex; align-items: center; padding: 0 10px; font-size: 14px; white-space: nowrap; cursor: pointer; text-align: left; overflow: visible; }
  .bar.active { background: var(--ink); color: var(--paper); }
  .bar.done { background: var(--moss); border-color: var(--moss); color: var(--paper); }
  .bar.blocked { border-color: var(--ember); border-width: 2px; }
  .bar .name { overflow: visible; }
  .bar .flag { font-family: var(--mono); font-size: 11px; color: var(--ember); margin-left: 8px; }
  .bar.active .flag, .bar.done .flag { color: inherit; }
  .bar .outside { position: absolute; left: calc(100% + 8px); color: var(--graphite); font-size: 13px; }
  .today { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px solid var(--ember); pointer-events: none; }
  .today span { position: absolute; top: 7px; left: 0; background: var(--paper); padding: 1px 6px 1px 4px; z-index: 2; white-space: nowrap; font-family: var(--mono); font-size: 11px; color: var(--ember); }
  button.tl-phase { display: block; background: none; border: 0; cursor: pointer; }
  button.tl-phase:hover { color: var(--ink); }
  .bar { user-select: none; -webkit-user-select: none; }
  @media (hover: hover) and (pointer: fine) { .bar { cursor: grab; } .bar.dragging { cursor: grabbing; opacity: .8; z-index: 3; } }
  .drag-hint { display: none; }
  @media (hover: hover) and (pointer: fine) { .drag-hint { display: inline; margin-left: auto; } }
  .notice { display: flex; gap: 8px 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid var(--ember); padding: 10px 12px; margin-bottom: 16px; font-size: 15px; }
  .notice .btn { padding: 4px 12px; font-size: 14px; }
  .legend { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 16px; font-size: 13px; color: var(--graphite); }
  .legend i { display: inline-block; width: 14px; height: 10px; border: 1px solid var(--ink); margin-right: 6px; vertical-align: -1px; }

  /* Lists */
  .list { list-style: none; border-top: 1px solid var(--rule); }
  .list > li { border-bottom: 1px solid var(--rule); }
  .row-btn { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; width: 100%; padding: 16px 0; background: none; border: 0; text-align: left; cursor: pointer; }
  .row-btn strong { font-weight: 500; }
  .row-btn .meta { grid-column: 1 / -1; color: var(--graphite); font-size: 15px; }
  .chip { font-family: var(--mono); font-size: 12px; color: var(--graphite); display: inline-flex; align-items: center; gap: 8px; align-self: start; padding-top: 2px; white-space: nowrap; }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 999px; background: var(--pencil); }
  .chip.ok::before { background: var(--moss); }
  .chip.warn { color: var(--ember); }
  .chip.warn::before { background: var(--ember); }
  .chip.ink::before { background: var(--ink); }
  .doc-row { display: flex; align-items: center; gap: 16px; }
  .doc-row .row-btn { flex: 1; min-width: 0; }
  .doc-open { font-size: 14px; white-space: nowrap; color: var(--graphite); }
  .room .prog { height: 2px; background: var(--rule); margin-top: auto; }
  .room .prog i { display: block; height: 100%; background: var(--moss); }
  .toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10; display: flex; gap: 16px; align-items: center; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 4px; font-size: 15px; max-width: calc(100vw - 32px); }
  .toast button { background: none; border: 0; color: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; white-space: nowrap; }
  .empty { color: var(--graphite); padding: 24px 0; font-family: var(--serif); font-style: italic; font-size: 22px; }

  /* Rooms */
  .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0; border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); }
  .room { border: 0; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 16px; background: none; text-align: left; cursor: pointer; min-height: 140px; display: flex; flex-direction: column; gap: 8px; }
  .room h3 { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.1; }
  .room .meta { color: var(--graphite); font-size: 14px; }
  .room ul { list-style: none; font-size: 14px; }

  /* Dialogue */
  .thread { list-style: none; display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
  .msg { max-width: 560px; padding: 12px 16px; background: var(--paper-deep); }
  .msg.client { margin-left: auto; background: transparent; border: 1px solid var(--rule); }
  .msg .who { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 4px; }
  .composer { display: grid; grid-template-columns: 140px 1fr auto; gap: 8px; align-items: end; border-top: 1px solid var(--rule); padding-top: 16px; }
  @media (max-width: 560px) { .composer { grid-template-columns: 1fr; } }

  /* Forms */
  input[type=text], input[type=date], select, textarea {
    width: 100%; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 8px 10px; line-height: 22px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); }
  textarea { min-height: 80px; resize: vertical; }
  dialog { border: 1px solid var(--rule); background: var(--paper); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); margin: auto; }
  dialog::backdrop { background: rgba(20, 19, 17, .45); }
  dialog form { padding: 24px; display: grid; gap: 16px; }
  dialog h3 { font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.1; }
  .field { display: grid; gap: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid2 > *, .field > * { min-width: 0; }
  .actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; padding-top: 8px; }
  .actions .right { display: flex; gap: 8px; margin-left: auto; }
  .hint { font-size: 13px; color: var(--graphite); }
  .warn-text { font-size: 14px; color: var(--ember); }

  .right-top { display: flex; align-items: center; gap: 20px; }
  .lang { display: flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
  .lang button { background: none; border: 0; padding: 3px 9px; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--graphite); cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .lang button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  footer { border-top: 1px solid var(--rule); padding: 24px 0 48px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--graphite); }
  footer .tools { display: flex; gap: 16px; flex-wrap: wrap; }
  footer button { background: none; border: 0; color: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>

  <header class="top">
    <a class="brand" href="/sitefellow/"><b>Sitefellow</b><span class="label">Beta</span></a>

</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span></span><button type="button" id="undoBtn"></button></div>

  function timeline() {
    const head = `<div class="panel-head"><h2>${T().tlHead}</h2><button class="btn" data-act="add-task">${T().addTask}</button></div>`;

      <span class="right"><button type="button" class="btn ghost" data-dlg="cancel">${T().cancel}</button><button type="submit" class="btn">${T().save}</button></span></div>`;
    form.oninput = null;
    form.onsubmit = (e) => { e.preventDefault(); $('#dlgErr').hidden = true; if (commit(() => onSave(new FormData(form)))) dlg.close(); };
    form.onclick = (e) => {
      const a = e.target.closest('[data-dlg]'); if (!a) return;
      if (a.dataset.dlg === 'cancel') dlg.close();
      // No "are you sure": a delete can be undone from the toast or with Ctrl/Cmd+Z.
      if (a.dataset.dlg === 'delete') { dlg.close(); commit(onDelete, T().deleted); }
    };
    dlg.showModal();
    const first = form.querySelector('input,textarea,select'); if (first) first.focus();
  }
  // Click on the backdrop closes, but not when a text selection merely ends out there.
  let downOnBackdrop = false;
  dlg.addEventListener('pointerdown', (e) => { downOnBackdrop = e.target === dlg; });
  dlg.addEventListener('click', (e) => { if (e.target === dlg && downOnBackdrop) dlg.close(); });

  function taskDialog(t) {
    const isNew = !t;
    if (isNew) {
      // A new task starts where the plan currently ends, in the phase that is being worked on.
      const cur = S.tasks.find(x => x.status === 'active') || S.tasks[S.tasks.length - 1];
      t = { id: uid(), name: '', phase: cur?.phase || S.phases[0]?.id || '__new', trade: '', room: '', start: plus(0), end: plus(6), status: 'planned', dep: '', blocker: '' };
    }
    open(`<h3>${isNew ? T().newTask : T().editTask}</h3>
      <div class="field"><label class="label" for="f-name">${T().task}</label><input type="text" id="f-name" name="name" value="${esc(t.name)}" required></div>
      <div class="grid2">
        <div class="field"><label class="label" for="f-phase">${T().phase}</label><select id="f-phase" name="phase">${opts(S.phases, t.phase)}<option value="__new" ${t.phase === '__new' ? 'selected' : ''}>${T().newPhase}</option></select></div>
        <div class="field"><label class="label" for="f-trade">${T().trade}</label><input type="text" id="f-trade" name="trade" value="${esc(t.trade)}" list="trades" autocomplete="off">
          <datalist id="trades">${[...new Set(S.tasks.map(x => x.trade).filter(Boolean))].map(v => `<option value="${esc(v)}">`).join('')}</datalist></div>
      </div>
      <div class="field" id="f-newphase-wrap" hidden><label class="label" for="f-newphase">${T().phaseName}</label><input type="text" id="f-newphase" name="phaseName"></div>
      <div class="grid2">
        <div class="field"><label class="label" for="f-start">${T().start}</label><input type="date" id="f-start" name="start" value="${t.start}" required></div>
        <div class="field"><label class="label" for="f-end">${T().end}</label><input type="date" id="f-end" name="end" value="${t.end}" required></div>
      </div>
      <div class="grid2">
        <div class="field"><label class="label" for="f-status">${T().statusL}</label><select id="f-status" name="status">${Object.entries(statusLabel()).map(([k, v]) => `<option value="${k}" ${k === t.status ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        <div class="field"><label class="label" for="f-room">${T().room}</label><select id="f-room" name="room">${opts(S.rooms, t.room, T().noRoom)}</select></div>
      </div>
      <div class="field"><label class="label" for="f-dep">${T().after}</label><select id="f-dep" name="dep">${opts(S.tasks.filter(x => x.id !== t.id && !reaches(x, t.id)), t.dep, T().noDep)}</select>
        <span class="warn-text" id="f-depwarn" hidden><span></span> <button type="button" class="btn ghost" data-dlg="fixdep" style="padding:2px 10px;font-size:13px">${T().moveAfter}</button></span></div>
      <div class="field"><label class="label" for="f-blocker">${T().blocking}</label><input type="text" id="f-blocker" name="blocker" value="${esc(t.blocker)}" placeholder="${T().blockPh}"></div>`,
      (f) => {
        const v = Object.fromEntries(f.entries());
        const phaseName = (v.phaseName || '').trim(); delete v.phaseName;
        if (!isDate(v.start) || !isDate(v.end) || v.end < v.start) return fail(T().endErr);
        if (v.phase === '__new') {
          if (!phaseName) { $('#f-newphase').focus(); return fail(T().phaseName); }
          const ph = { id: uid(), name: phaseName }; S.phases.push(ph); v.phase = ph.id;
        }
        v.name = v.name.trim(); v.trade = v.trade.trim(); v.blocker = v.blocker.trim();
        if (v.blocker && v.status !== 'done') v.status = 'blocked';
        Object.assign(t, v);
        if (isNew) S.tasks.push(t);
      },
      isNew ? null : () => { S.tasks = S.tasks.filter(x => x.id !== t.id); S.tasks.forEach(x => { if (x.dep === t.id) x.dep = ''; }); });

    // Live behaviour: the end date follows the start date, and a clash is flagged while editing.
    const el = form.elements;
    let prevStart = el.start.value;
    const live = (e) => {
      if (e && e.target === el.start && isDate(el.start.value)) {
        if (isDate(prevStart) && isDate(el.end.value)) el.end.value = shift(el.end.value, diff(prevStart, el.start.value));
        prevStart = el.start.value;
      }
      $('#f-newphase-wrap').hidden = el.phase.value !== '__new';
      const d = byId(S.tasks, el.dep.value), w = $('#f-depwarn');
      const clash = d && el.status.value !== 'done' && isDate(el.start.value) && el.start.value <= d.end;
      w.hidden = !clash;
      if (clash) w.firstElementChild.textContent = T().startsBefore(d.name, fmt(d.end));
    };
    form.oninput = live; live();
    const base = form.onclick;
    form.onclick = (e) => {
      if (!e.target.closest('[data-dlg="fixdep"]')) return base(e);
      const d = byId(S.tasks, el.dep.value); if (!d) return;
      const len = isDate(el.start.value) && isDate(el.end.value) ? Math.max(0, diff(el.start.value, el.end.value)) : 6;
      el.start.value = prevStart = shift(d.end, 1); el.end.value = shift(el.start.value, len); live();
    };
  }

  function phaseDialog(ph) {
    if (!ph) return;
    open(`<h3>${T().renamePhase}</h3>
      <div class="field"><label class="label" for="p-name">${T().name}</label><input type="text" id="p-name" name="name" value="${esc(ph.name)}" required></div>`,
      (f) => { ph.name = String(f.get('name')).trim() || ph.name; });
  }

  function decisionDialog(d) {
    const isNew = !d;
    d = d || { id: uid(), title: '', detail: '', status: 'open', decision: '', owner: T().client, due: plus(7) };
    open(`<h3>${isNew ? T().newDec : T().decision}</h3>
      <div class="field"><label class="label" for="d-title">${T().question}</label><input type="text" id="d-title" name="title" value="${esc(d.title)}" required></div>
      <div class="field"><label class="label" for="d-detail">${T().context}</label><textarea id="d-detail" name="detail">${esc(d.detail)}</textarea></div>
      <div class="grid2">
        <div class="field"><label class="label" for="d-owner">${T().who}</label><input type="text" id="d-owner" name="owner" value="${esc(d.owner)}"></div>
        <div class="field"><label class="label" for="d-due">${T().by}</label><input type="date" id="d-due" name="due" value="${d.due || ''}"></div>
      </div>
      <div class="field"><label class="label" for="d-decision">${T().decision}</label><input type="text" id="d-decision" name="decision" value="${esc(d.decision)}" placeholder="${T().decPh}"></div>
      <p class="hint">${T().decHint}</p>`,
      (f) => { const v = Object.fromEntries(f.entries()); v.status = v.decision.trim() ? 'decided' : 'open'; Object.assign(d, v); if (isNew) S.decisions.push(d); },
      isNew ? null : () => { S.decisions = S.decisions.filter(x => x.id !== d.id); });
  }

  function roomDialog(r) {
    const isNew = !r;
    r = r || { id: uid(), name: '', notes: '' };
    open(`<h3>${isNew ? T().newRoom : T().room}</h3>
      <div class="field"><label class="label" for="r-name">${T().name}</label><input type="text" id="r-name" name="name" value="${esc(r.name)}" required></div>
      <div class="field"><label class="label" for="r-notes">${T().notes}</label><textarea id="r-notes" name="notes">${esc(r.notes)}</textarea></div>`,
      (f) => { Object.assign(r, Object.fromEntries(f.entries())); if (isNew) S.rooms.push(r); },
      isNew ? null : () => { S.rooms = S.rooms.filter(x => x.id !== r.id); S.tasks.forEach(t => { if (t.room === r.id) t.room = ''; }); });
  }

  function docDialog(d) {
    const isNew = !d;
    d = d || { id: uid(), title: '', kind: 'Drawing', url: '' };
    open(`<h3>${isNew ? T().newDoc : T().document}</h3>
      <div class="field"><label class="label" for="o-title">${T().title}</label><input type="text" id="o-title" name="title" value="${esc(d.title)}" required></div>
      <div class="grid2">
        <div class="field"><label class="label" for="o-kind">${T().type}</label><select id="o-kind" name="kind">${Object.keys(T().kinds).map(k => `<option value="${k}" ${k === d.kind ? 'selected' : ''}>${T().kinds[k]}</option>`).join('')}</select></div>
        <div class="field"><label class="label" for="o-url">${T().link}</label><input type="text" inputmode="url" autocapitalize="off" spellcheck="false" id="o-url" name="url" value="${esc(d.url)}" placeholder="https://"></div>
      </div>
      ${safeUrl(d.url) ? `<a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">${T().openDoc} ↗</a>` : `<p class="hint">${T().linkHint}</p>`}`,
      (f) => {
        const v = Object.fromEntries(f.entries());
        v.url = v.url.trim();
        if (v.url && !/^[a-z][a-z0-9+.-]*:/i.test(v.url)) v.url = 'https://' + v.url;
        if (v.url && !safeUrl(v.url)) return fail(T().badLink);
        Object.assign(d, v); if (isNew) S.docs.push(d);
      },
      isNew ? null : () => { S.docs = S.docs.filter(x => x.id !== d.id); });
  }

  // Events
  let drag = null, suppressClick = false;
  document.addEventListener('click', (e) => {
    if (suppressClick) { suppressClick = false; return; }
    const lb = e.target.closest('[data-lang]');
    if (lb) { setLang(lb.dataset.lang); return; }
    const tb = e.target.closest('[data-tab]');
    if (tb) { setTab(tb.dataset.tab); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    const id = a.dataset.id;
    ({
      'add-task': () => taskDialog(), 'edit-task': () => taskDialog(byId(S.tasks, id)),
      'edit-phase': () => phaseDialog(byId(S.phases, id)),
      'push': () => commit(pushClashes, T().pushed),
      'add-decision': () => decisionDialog(), 'edit-decision': () => decisionDialog(byId(S.decisions, id)),
      'add-room': () => roomDialog(), 'edit-room': () => roomDialog(byId(S.rooms, id)),
      'add-doc': () => docDialog(), 'edit-doc': () => docDialog(byId(S.docs, id))
    })[a.dataset.act]?.();
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'composer') return;
    e.preventDefault();
    const text = $('#msgText').value.trim(); if (!text) return;
    role = $('#role').value;
    commit(() => { S.messages.push({ id: uid(), author: role === 'client' ? T().you : T().contractor, role, text, at: plus(0) }); });
    $('#msgText').focus();
  });
  document.addEventListener('change', (e) => { if (e.target.id === 'role') role = e.target.value; });

  // Tabs follow the usual keyboard pattern: arrows, Home and End.
  $('#tabs').addEventListener('keydown', (e) => {
    const i = TABS.indexOf(tab);
    const n = { ArrowRight: (i + 1) % TABS.length, ArrowLeft: (i + TABS.length - 1) % TABS.length, Home: 0, End: TABS.length - 1 }[e.key];
    if (n === undefined) return;
    e.preventDefault(); setTab(TABS[n], true);
  });

  // Drag a bar sideways with the mouse to move a task, snapping to whole days. Touch keeps scrolling.
  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    const bar = e.target.closest('.bar'); if (bar) drag = { bar, x: e.clientX, d: 0, on: false };
  });
  document.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    if (!drag.on && Math.abs(dx) < 5) return;
    drag.on = true; drag.d = Math.round(dx / PX);
    drag.bar.classList.add('dragging'); drag.bar.style.transform = `translateX(${drag.d * PX}px)`;
  });
  const endDrag = (apply) => {
    if (!drag) return;
    const { bar, d, on } = drag; drag = null;
    if (!on) return;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
    const t = byId(S.tasks, bar.dataset.id);
    if (apply && t && d) commit(() => { t.start = shift(t.start, d); t.end = shift(t.end, d); }, T().moved);
    else { bar.classList.remove('dragging'); bar.style.transform = ''; }
  };
  document.addEventListener('pointerup', () => endDrag(true));
  document.addEventListener('pointercancel', () => endDrag(false));

  $('#undoBtn').onclick = undo;
  document.addEventListener('keydown', (e) => {
    if (!(e.ctrlKey || e.metaKey) || e.shiftKey || e.key.toLowerCase() !== 'z' || dlg.open) return;
    if (e.target.closest('input, textarea, select, [contenteditable]')) return;
    if (history_.length) { e.preventDefault(); undo(); }
  });

  // Project name and subtitle are edited in place.
  [['#projectName', 'name', () => T().untitled], ['#projectSub', 'sub', () => '']].forEach(([sel, key, fallback]) => {
    const el = $(sel);
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } if (e.key === 'Escape') { el.textContent = S.project[key]; el.blur(); } });
    el.addEventListener('paste', (e) => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData.getData('text/plain') || '').replace(/\s+/g, ' ')); });
    el.addEventListener('blur', () => {
      const v = el.textContent.replace(/\s+/g, ' ').trim() || fallback();
      if (v !== S.project[key]) commit(() => { S.project[key] = v; }); else render();
    });
  });

  $('#exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = ((S.project.name || 'sitefellow').toLowerCase().replace(/[^a-z0-9æøå]+/g, '-').replace(/^-|-$/g, '') || 'sitefellow') + '-' + plus(0) + '.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('#importBtn').onclick = () => $('#importFile').click();
  $('#importFile').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const d = normalize(JSON.parse(await f.text()));
      if (!d) throw new Error();
      snapshot(); d.demo = ''; S = d; save(); render(true); toast(T().imported, true);
    } catch (err) { alert(T().badFile); }
    e.target.value = '';
  };
  $('#resetBtn').onclick = () => { if (S.demo || confirm(T().confirmReset)) { snapshot(); S = demo(lang); save(); setTab('timeline'); toast(T().resetDone, true); } };

  // Keep two open tabs of the same browser in step.
  window.addEventListener('storage', (e) => {
    if (e.key !== KEY || !e.newValue || dlg.open) return;
    try { const d = normalize(JSON.parse(e.newValue)); if (d) { S = d; render(); } } catch (err) {}
  });

  if (S.demo && S.demo !== lang) { S = demo(lang); save(); }

  // Only a change of day width needs a redraw; mobile browsers fire resize on every scroll.
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (tab === 'timeline' && (window.innerWidth < 600 ? 9 : 13) !== PX) render(true); }, 200); });
  render();
})();
</script>

</body>
</html>
