<html lang="en">

<title>Dragør Eagles · Tuesday Hoops</title>
<meta name="description" content="Dragør Eagles basketball. Tuesdays at 20:00. Check in, show up, climb the board.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --purple: #3d1470;
    --purple-deep: #2b0f4c;
    --teal: #12c8b6;
    --red: #ff2e4d;
    --gold: #ffc22e;
    --orange: #ff7a1a;
    --black: #111014;
    --white: #fffaf0;
    --silver: #c9c6d6;
    --display: "Bungee", "Archivo", Impact, sans-serif;
    --shade: "Bungee Shade", "Bungee", Impact, sans-serif;
    --body: "Archivo", system-ui, sans-serif;
    --narrow: "Archivo Narrow", "Archivo", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; color-scheme: dark; }
  body {
    min-height: 100vh;
    font-family: var(--body);
    color: var(--white);
    background-color: var(--purple-deep);
    background: linear-gradient(160deg, #4a1786 0%, #2b0f4c 55%, #1b0a33 100%) fixed;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 18px; }


  /* Background: jersey bands, halftone and scattered 90s shapes */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .band { position: absolute; left: -30%; width: 160%; transform: rotate(-14deg); }
  .band.b1 { top: 18%; height: 70px; background: var(--teal); box-shadow: 0 0 0 6px var(--black); opacity: .9; }
  .band.b2 { top: calc(18% + 86px); height: 18px; background: var(--red); box-shadow: 0 0 0 4px var(--black); opacity: .9; }
  .band.b3 { top: 74%; height: 34px; background: var(--gold); box-shadow: 0 0 0 5px var(--black); transform: rotate(9deg); opacity: .85; }
  .halftone { position: absolute; width: 70vmax; height: 70vmax; right: -20vmax; bottom: -22vmax; background: radial-gradient(circle, rgba(255,46,77,.55) 2.6px, transparent 3px) 0 0 / 16px 16px; -webkit-mask: radial-gradient(circle, #000 0%, transparent 68%); mask: radial-gradient(circle, #000 0%, transparent 68%); }
  .halftone.h2 { right: auto; bottom: auto; left: -26vmax; top: -24vmax; background: radial-gradient(circle, rgba(18,200,182,.5) 2.4px, transparent 2.8px) 0 0 / 14px 14px; }
  .shape { position: absolute; animation: float var(--d, 14s) ease-in-out var(--delay, 0s) infinite alternate; }
  .shape svg { display: block; width: 100%; height: auto; overflow: visible; }
  @keyframes float { from { transform: translate(0, 0) rotate(var(--r, 0deg)); } to { transform: translate(var(--dx, 12px), var(--dy, -18px)) rotate(calc(var(--r, 0deg) + var(--spin, 20deg))); } }
  @media (prefers-reduced-motion: reduce) { .shape { animation: none; transform: rotate(var(--r, 0deg)); } }

  /* Hero */
  .hero { position: relative; padding: 28px 0 8px; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; }
  .crest { width: 250px; height: 250px; overflow: visible; filter: drop-shadow(7px 7px 0 var(--black)); animation: bob 3.2s ease-in-out infinite; }
  .crest .burst { transform-box: fill-box; transform-origin: center; animation: spin 40s linear infinite; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-2deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .crest, .crest .burst { animation: none; } }
  .title { font-family: var(--display); font-size: clamp(38px, 8.4vw, 80px); line-height: .92; color: var(--gold); -webkit-text-stroke: .09em var(--black); paint-order: stroke fill; text-shadow: .06em .06em 0 var(--black), .12em .12em 0 var(--red), .16em .16em 0 var(--black); letter-spacing: .02em; transform: skew(-6deg) rotate(-3deg); transform-origin: left; }
  .title small { display: block; font-size: .46em; color: var(--teal); text-shadow: .08em .08em 0 var(--black); letter-spacing: .04em; margin-top: 10px; }
  .tagline { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .sticker { font-family: var(--display); font-size: 14px; padding: 6px 12px; background: var(--red); color: var(--white); border: 3px solid var(--black); box-shadow: 4px 4px 0 var(--black); transform: rotate(-2deg); }
  .sticker:nth-child(2) { background: var(--teal); color: var(--black); transform: rotate(1.5deg); }
  .sticker:nth-child(3) { background: var(--gold); color: var(--black); transform: rotate(-1deg); }
  @media (max-width: 560px) { .crest { width: 126px; height: 126px; } .hero { gap: 6px 12px; } .title { font-size: clamp(30px, 8.6vw, 44px); } }

  /* Panels */
  .panel { position: relative; margin-top: 30px; background: var(--white); color: var(--black); border: 4px solid var(--black); box-shadow: 10px 10px 0 var(--black), 10px 10px 0 4px var(--teal); padding: 22px 20px 24px; }
  .panel.teal { background: var(--teal); }
  .panel.stripes { background-image: repeating-linear-gradient(90deg, transparent 0 22px, rgba(61,20,112,.09) 22px 25px); }
  .panel h2 { font-family: var(--display); font-size: clamp(24px, 5vw, 36px); line-height: 1; color: var(--purple); text-transform: uppercase; }
  .panel h2 .hot { color: var(--red); }
  .kicker { font-family: var(--narrow); font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--purple); margin-bottom: 8px; }
  .claw { position: absolute; top: -26px; right: 18px; width: 86px; height: 60px; }

  /* Next game */
  .game { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
  .date { font-family: var(--display); font-size: clamp(30px, 8vw, 56px); line-height: .95; color: var(--black); }
  .date span { color: var(--red); }
  .meter { text-align: center; background: var(--purple); color: var(--gold); border: 4px solid var(--black); padding: 8px 14px 10px; transform: rotate(3deg); box-shadow: 5px 5px 0 var(--black); min-width: 108px; }
  .meter b { display: block; font-family: var(--display); font-size: 52px; line-height: 1; }
  .meter i { font-style: normal; font-family: var(--narrow); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--white); }
  .verdict { margin-top: 14px; font-family: var(--display); font-size: 18px; padding: 8px 12px; display: inline-block; border: 3px solid var(--black); }
  .verdict.on { background: var(--teal); }
  .verdict.close { background: var(--gold); }
  .verdict.off { background: var(--red); color: var(--white); }

  .me { margin-top: 20px; padding-top: 18px; border-top: 4px dashed var(--purple); }
  .me-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .me select, .me input { border: 3px solid var(--black); background: var(--white); padding: 10px 12px; font-weight: 700; min-width: 0; flex: 1; border-radius: 0; }
  .me select:focus, .me input:focus { outline: 3px solid var(--teal); outline-offset: 0; }
  .btn { font-family: var(--display); font-size: 18px; padding: 12px 18px; border: 4px solid var(--black); cursor: pointer; box-shadow: 5px 5px 0 var(--black); transition: transform .08s, box-shadow .08s; background: var(--gold); color: var(--black); text-transform: uppercase; touch-action: manipulation; }
  .btn:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--black); }
  .btn:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
  .btn.in { background: var(--teal); }
  .btn.out { background: var(--red); color: var(--white); }
  .btn.small { font-size: 14px; padding: 8px 12px; box-shadow: 3px 3px 0 var(--black); }
  .btn[aria-pressed="true"] { outline: 4px solid var(--purple); outline-offset: 3px; }
  .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .choice .btn { font-size: clamp(15px, 4.2vw, 26px); padding: 16px 6px; white-space: nowrap; }
  .hello { font-family: var(--narrow); font-weight: 700; font-size: 16px; }
  .link { background: none; border: 0; text-decoration: underline; cursor: pointer; font-weight: 700; color: var(--purple); }

  .roster { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip { font-family: var(--narrow); font-weight: 700; font-size: 15px; padding: 5px 10px; border: 3px solid var(--black); background: var(--white); }
  .chip.in { background: var(--teal); }
  .chip.maybe { background: var(--gold); }
  .chip.out { background: var(--black); color: var(--silver); text-decoration: line-through; }
  .chip.unknown { background: transparent; border-style: dashed; color: #6c6780; }

  /* Board */
  .board { width: 100%; border-collapse: collapse; margin-top: 14px; font-family: var(--narrow); font-weight: 700; }
  .board th { font-family: var(--display); font-size: 13px; text-align: left; background: var(--purple); color: var(--gold); padding: 8px 10px; font-weight: 400; }
  .board th.n, .board td.n { text-align: right; }
  .board td { padding: 10px; border-bottom: 3px solid var(--black); font-size: 17px; }
  .board tr:nth-child(odd) td { background: rgba(18,200,182,.12); }
  .rank { font-family: var(--display); color: var(--red); width: 42px; }
  .bar { height: 10px; background: #e3dff0; border: 2px solid var(--black); margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--red); }
  .badges { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-top: 18px; }
  .badge { border: 4px solid var(--black); padding: 14px; box-shadow: 6px 6px 0 var(--black); }
  .badge.mvp { background: var(--gold); transform: rotate(-1.5deg); }
  .badge.ghost { background: var(--purple); color: var(--white); transform: rotate(1.5deg); }
  .badge.hot { background: var(--red); color: var(--white); transform: rotate(1deg); }
  .badge.rec { background: var(--teal); transform: rotate(-1deg); }
  .badge.early { background: var(--white); transform: rotate(1.5deg); }
  .board td.n, .board th.n { padding-left: 4px; padding-right: 6px; }
  @media (max-width: 420px) { .board td { font-size: 15px; padding: 9px 5px; } .board th { font-size: 11px; padding: 7px 5px; } }
  .badge .k { font-family: var(--display); font-size: 14px; }
  .badge .who { font-family: var(--shade); font-size: 30px; line-height: 1; margin: 8px 0 6px; word-break: break-word; }
  .badge .why { font-family: var(--narrow); font-weight: 700; }

  .history { list-style: none; margin-top: 12px; }
  .history li { display: grid; grid-template-columns: 112px 52px 1fr; gap: 10px; padding: 9px 0; border-bottom: 3px solid var(--black); font-family: var(--narrow); font-weight: 700; align-items: baseline; }
  .history .d { font-family: var(--display); font-size: 14px; color: var(--purple); }
  .history .c { font-family: var(--display); font-size: 18px; color: var(--red); }

  .empty { font-family: var(--narrow); font-weight: 700; font-size: 17px; padding: 8px 0; }
  .notice { margin-top: 30px; background: var(--red); color: var(--white); border: 4px solid var(--black); padding: 16px; font-family: var(--narrow); font-weight: 700; box-shadow: 8px 8px 0 var(--black); }
  .notice code { background: var(--black); padding: 1px 6px; }
  footer { margin: 44px 0 30px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-family: var(--narrow); font-weight: 700; font-size: 14px; color: var(--silver); }
  footer a { color: var(--gold); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) rotate(-2deg) scale(.6); opacity: 0; background: var(--gold); color: var(--black); border: 4px solid var(--black); box-shadow: 6px 6px 0 var(--black); font-family: var(--display); font-size: 22px; padding: 12px 18px; transition: all .25s cubic-bezier(.2,1.6,.4,1); pointer-events: none; z-index: 9; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) rotate(-2deg) scale(1); }
  @media (prefers-reduced-motion: reduce) { .crest { animation: none; } .toast { transition: none; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .boo { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 20; overflow: hidden; }
  .boo span { font-family: var(--display); font-size: 17vw; line-height: 1; white-space: nowrap; color: var(--red); -webkit-text-stroke: .06em var(--black); paint-order: stroke fill; text-shadow: .05em .05em 0 var(--black), .1em .1em 0 var(--gold), .13em .13em 0 var(--black); animation: boo 3.6s cubic-bezier(.3,.7,.4,1) forwards; }
  @keyframes boo {
    0% { transform: scale(.15) rotate(0); opacity: 0; }
    8% { opacity: 1; }
    15% { transform: scale(.5) translate(-2%, 1%) rotate(-4deg); }
    25% { transform: scale(.75) translate(2%, -1%) rotate(4deg); }
    35% { transform: scale(.95) translate(-2%, 2%) rotate(-5deg); }
    45% { transform: scale(1.1) translate(3%, -1%) rotate(5deg); }
    55% { transform: scale(1.25) translate(-3%, 2%) rotate(-6deg); opacity: 1; }
    65% { transform: scale(1.4) translate(3%, -2%) rotate(6deg); }
    75% { transform: scale(1.55) translate(-3%, 1%) rotate(-5deg); opacity: .8; }
    85% { transform: scale(1.7) translate(2%, -1%) rotate(4deg); opacity: .45; }
    100% { transform: scale(1.9) rotate(-3deg); opacity: 0; }
  }
  .boo.yeah span { font-size: 12vw; color: var(--gold); text-shadow: .05em .05em 0 var(--black), .1em .1em 0 var(--teal), .13em .13em 0 var(--black); }
  @media (prefers-reduced-motion: reduce) { .boo span { animation: booFade 3s ease forwards; } @keyframes booFade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } } }

  /* Countdown to tip-off: calmer far out, frantic near 20:00 */
  .countdown { margin-top: 12px; font-family: var(--display); font-size: clamp(18px, 5vw, 26px); line-height: 1.1; color: var(--purple); display: inline-block; transform-origin: left center; }
  .countdown small { display: block; font-family: var(--narrow); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--black); }
  .countdown.soon { animation: cdPulse 1.6s ease-in-out infinite; }
  .countdown.hot { color: var(--red); animation: cdShake .5s linear infinite; }
  .countdown.panic { color: var(--white); background: var(--red); border: 3px solid var(--black); padding: 4px 10px; animation: cdShake .18s linear infinite, cdFlash .5s steps(2) infinite; }
  .countdown.live { color: var(--black); background: var(--gold); border: 3px solid var(--black); padding: 4px 10px; animation: cdPulse .8s ease-in-out infinite; }
  @keyframes cdPulse { 50% { transform: scale(1.06); } }
  @keyframes cdShake { 25% { transform: translate(-2px, 1px) rotate(-1deg); } 50% { transform: translate(2px, -1px) rotate(1deg); } 75% { transform: translate(-1px, -1px) rotate(-.5deg); } }
  @keyframes cdFlash { 50% { background: var(--purple); } }

  /* On fire: 5+ Tuesdays in a row */
  .fire { position: relative; animation: fireShake .35s linear infinite; box-shadow: 0 0 0 3px var(--gold), 0 0 14px 4px rgba(255, 70, 40, .85); }
  .board td .fire { display: inline-block; box-shadow: none; text-shadow: 0 0 8px rgba(255, 90, 40, .9); color: var(--red); }
  @keyframes fireShake { 25% { transform: translate(-1px, 0) rotate(-1.5deg); } 75% { transform: translate(1px, -1px) rotate(1.5deg); } }

  /* Game on: confetti */
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 19; overflow: hidden; }
  .confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border: 2px solid var(--black); animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); } }
  @media (prefers-reduced-motion: reduce) { .countdown, .fire { animation: none !important; } .confetti { display: none; } }

  /* Injury list */
  .panel.er { background: var(--white); box-shadow: 10px 10px 0 var(--black), 10px 10px 0 4px var(--red); }
  .ir { list-style: none; margin-top: 12px; display: grid; gap: 12px; }
  .ir li { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; border: 4px solid var(--black); padding: 10px 12px; background: repeating-linear-gradient(-45deg, rgba(255,46,77,.08) 0 10px, transparent 10px 20px); box-shadow: 5px 5px 0 var(--black); }
  .ir li:nth-child(odd) { transform: rotate(-.8deg); }
  .ir li:nth-child(even) { transform: rotate(.8deg); }
  .ir .x { grid-row: span 2; font-size: 34px; line-height: 1; }
  .ir .n { font-family: var(--display); font-size: 20px; line-height: 1; }
  .ir .w { font-family: var(--narrow); font-weight: 700; font-size: 15px; }
  .ir .w b { color: var(--red); }
  .chip.hurt { background: repeating-linear-gradient(-45deg, var(--white) 0 6px, rgba(255,46,77,.18) 6px 12px); }
  .hurtbox { margin-top: 16px; }
  .hurtbox .me-row { margin-top: 10px; }
  .hurtbox .status { font-family: var(--narrow); font-weight: 700; margin-bottom: 8px; }
  .hurtbox label.l { font-family: var(--narrow); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; width: 100%; }
</style>

<script>
(() => {
  // Scatter a fresh mix of 90s shapes on every visit, so the pattern never repeats.
  const bg = document.getElementById('bg'); if (!bg) return;
  const C = ['#12c8b6', '#ff2e4d', '#ffc22e', '#fffaf0', '#ff7a1a', '#c9c6d6'];
  const K = '#111014';
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const R = (a, b) => a + Math.random() * (b - a);
  const shapes = [
    c => `<svg viewBox="0 0 60 60"><path d="M6 52L30 6L54 52Z" fill="${c}" stroke="${K}" stroke-width="5" stroke-linejoin="round"/></svg>`,
    c => `<svg viewBox="0 0 120 30"><path d="M5 15c12-18 24 18 36 0s24 18 36 0 24 18 36 0" fill="none" stroke="${K}" stroke-width="11" stroke-linecap="round"/><path d="M5 15c12-18 24 18 36 0s24 18 36 0 24 18 36 0" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round"/></svg>`,
    c => `<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="24" fill="${c}" stroke="${K}" stroke-width="5"/></svg>`,
    c => `<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="22" fill="none" stroke="${c}" stroke-width="8"/></svg>`,
    c => `<svg viewBox="0 0 120 40"><path d="M4 32L24 8L44 32L64 8L84 32L104 8L116 22" fill="none" stroke="${K}" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><path d="M4 32L24 8L44 32L64 8L84 32L104 8L116 22" fill="none" stroke="${c}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></svg>`,
    c => `<svg viewBox="0 0 40 40"><path d="M8 8L32 32M32 8L8 32" stroke="${c}" stroke-width="7" stroke-linecap="round"/></svg>`,
    c => `<svg viewBox="0 0 60 60"><rect x="10" y="10" width="40" height="40" fill="${c}" stroke="${K}" stroke-width="5"/></svg>`,
    c => `<svg viewBox="0 0 80 80"><path d="M40 4l9 25 27 2-21 17 7 27-22-15-22 15 7-27L4 31l27-2z" fill="${c}" stroke="${K}" stroke-width="5" stroke-linejoin="round"/></svg>`,
    c => `<svg viewBox="0 0 70 70"><path d="M10 60L60 10" stroke="${c}" stroke-width="10" stroke-linecap="round"/><path d="M26 64L64 26" stroke="${c}" stroke-width="5" stroke-linecap="round"/></svg>`,
    () => `<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="24" fill="#ff7a1a" stroke="${K}" stroke-width="4"/><path d="M6 30h48M30 6v48M14 13c9 9 9 25 0 34M46 13c-9 9-9 25 0 34" fill="none" stroke="${K}" stroke-width="3"/></svg>`
  ];
  const n = Math.round(Math.min(34, Math.max(16, innerWidth * innerHeight / 38000)));
  let html = '';
  for (let i = 0; i < n; i++) {
    const big = Math.random() < .18;
    const w = big ? R(90, 170) : R(22, 70);
    html += `<div class="shape" style="left:${R(-4, 96)}%;top:${R(-4, 96)}%;width:${w}px;opacity:${big ? .55 : R(.6, 1)};--r:${R(-40, 40)}deg;--spin:${R(-30, 30)}deg;--dx:${R(-24, 24)}px;--dy:${R(-30, 30)}px;--d:${R(9, 22)}s;--delay:${R(-20, 0)}s">${pick(shapes)(pick(C))}</div>`;
  }
  bg.insertAdjacentHTML('beforeend', html);
})();
</script>

<script>
(() => {
  const SUPABASE_URL = 'https://liqjvlaexuxchlfhtlhz.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxpcWp2bGFleHV4Y2hsZmh0bGh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3NjE1NDIsImV4cCI6MjExMDMzNzU0Mn0.B69F-iRsky4n3NrmCCzDP2BbFAmT3Ef8Ukq_ZYJRyG4';
  const MIN = 6;       // fewest players for a game
  const FULL = 10;     // full 5 on 5
  const ME_KEY = 'eagles-me';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const pretty = (s, opts = { weekday: 'short', day: 'numeric', month: 'short' }) => parse(s).toLocaleDateString('en-GB', opts);

  // Tuesday 20:00 is game time; the current game stays "next" until 22:00 that evening.
  function nextGame(now = new Date()) {
    const d = new Date(now); d.setHours(0, 0, 0, 0);
    const day = d.getDay();
    let add = (2 - day + 7) % 7;
    if (add === 0 && now.getHours() >= 22) add = 7;
    d.setDate(d.getDate() + add);
    return ymd(d);
  }
  function tuesdaysBetween(fromYmd, toYmd) { // inclusive list of Tuesdays from..to
    const out = []; const d = parse(fromYmd); const end = parse(toYmd);
    d.setDate(d.getDate() + ((2 - d.getDay() + 7) % 7));
    while (d <= end) { out.push(ymd(d)); d.setDate(d.getDate() + 7); }
    return out;
  }

  let sb = null, players = [], checkins = [], injuries = [], meId = null, hurtForm = false;
  try { meId = localStorage.getItem(ME_KEY); } catch (e) {}
  const GAME = nextGame();

  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800); }

  async function load() {
    const [p, c, h] = await Promise.all([
      sb.from('hoops_players').select('id,name,created_at').order('name'),
      sb.from('hoops_checkins').select('player_id,game_date,status,updated_at'),
      sb.from('hoops_injuries').select('id,player_id,note,back_by,since,healed_on')
    ]);
    if (p.error || c.error) throw (p.error || c.error);
    players = p.data; checkins = c.data; injuries = h.error ? [] : h.data;
    if (meId && !players.find(x => x.id === meId)) meId = null;
    render();
  }

  // Early bird: whoever checked in first for a run. A shared first timestamp (bulk-entered runs) has no early bird.
  const inOrder = (date) => checkins.filter(c => c.game_date === date && c.status === 'in' && c.updated_at).sort((a, b) => a.updated_at.localeCompare(b.updated_at));
  const earlyBird = (date) => { const o = inOrder(date); return o.length && !(o[1] && o[1].updated_at === o[0].updated_at) ? o[0].player_id : null; };
  const signedAt = (pid, date) => (checkins.find(c => c.player_id === pid && c.game_date === date && c.status === 'in') || {}).updated_at || '9';

  // Injured on a Tuesday: that run doesn't count against you, and your streak is paused, not broken.
  const openInjury = (pid) => injuries.find(x => x.player_id === pid && !x.healed_on);
  const injuredOn = (pid, date) => injuries.some(x => x.player_id === pid && x.since <= date && (!x.healed_on || x.healed_on > date));

  const statusFor = (pid, date) => (checkins.find(c => c.player_id === pid && c.game_date === date) || {}).status;

  function render() {
    $('#gameDate').innerHTML = `${esc(pretty(GAME, { weekday: 'long' }))}<br><span>${esc(pretty(GAME, { day: 'numeric', month: 'short' }))} · 20:00</span>`;
    const ins = players.filter(p => statusFor(p.id, GAME) === 'in');
    $('#countIn').textContent = ins.length;
    const v = $('#verdict');
    if (ins.length >= FULL) { v.className = 'verdict on'; v.textContent = 'Full 5 on 5! 🔥'; }
    else if (ins.length >= MIN) { v.className = 'verdict close'; v.textContent = `Game on! ${FULL - ins.length} more for 5 on 5`; }
    else { v.className = 'verdict off'; v.textContent = `Need ${MIN - ins.length} more to play`; }
    const maybes = players.filter(p => statusFor(p.id, GAME) === 'maybe').length;
    if (maybes) v.textContent += ` · ${maybes} maybe 🥸`;

    const order = { in: 0, maybe: 1, undefined: 2, hurt: 2.5, out: 3 };
    const rs = (p) => { const s = statusFor(p.id, GAME); return s || (openInjury(p.id) ? 'hurt' : undefined); };
    const bird = earlyBird(GAME);
    const fire = new Set(stats().filter(x => x.streak >= 5).map(x => x.id));
    $('#roster').innerHTML = [...players].sort((a, b) => order[rs(a)] - order[rs(b)] || signedAt(a.id, GAME).localeCompare(signedAt(b.id, GAME)) || a.name.localeCompare(b.name))
      .map(p => { const s = rs(p); return `<li class="chip ${s || 'unknown'}${fire.has(p.id) ? ' fire' : ''}"${p.id === bird ? ' title="Early bird: first to check in"' : ''}>${fire.has(p.id) ? '🔥 ' : ''}${p.id === bird ? '🐓 ' : ''}${esc(p.name)}${s === 'in' ? ' ✓' : s === 'maybe' ? ' 🥸' : s === 'hurt' ? ' 🤕' : ''}</li>`; }).join('') || '<li class="empty">No ballers yet. Be the first.</li>';

    const onKey = 'eagles-gameon-' + GAME;
    try {
      if (ins.length >= MIN && !localStorage.getItem(onKey)) { localStorage.setItem(onKey, '1'); gameOn(); }
      else if (ins.length < MIN) localStorage.removeItem(onKey);
    } catch (e) {}

    renderMe(); renderBoard(); renderInjuries(); renderHistory();
  }

  function renderMe() {
    const me = players.find(p => p.id === meId);
    const box = $('#me');
    if (!me) {
      box.innerHTML = `<div class="kicker">Who are you?</div>
        <div class="me-row">
          ${players.length ? `<label class="sr" for="pick">Pick your name</label><select id="pick"><option value="">Pick your name</option>${players.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><button class="btn small" data-act="pick">That's me</button>` : ''}
        </div>
        <div class="me-row" style="margin-top:12px">
          <label class="sr" for="newName">New player name</label><input id="newName" maxlength="40" placeholder="New here? Your name" autocomplete="name">
          <button class="btn small in" data-act="join">Join the squad</button>
        </div>`;
      return;
    }
    const s = statusFor(me.id, GAME);
    box.innerHTML = `<div class="hello">Yo, ${esc(me.name)}! You're <b>${s === 'in' ? 'IN' : s === 'out' ? 'OUT' : s === 'maybe' ? 'MAYBE' : 'not checked in yet'}</b> for ${esc(pretty(GAME))}. <button class="link" data-act="switch">Not ${esc(me.name)}?</button></div>
      <div class="choice">
        <button class="btn in" data-act="in" aria-pressed="${s === 'in'}">I'm in 🏀</button>
        <button class="btn out" data-act="out" aria-pressed="${s === 'out'}">I'm out</button>
      </div>` + hurtBox(me);
  }

  function hurtBox(me) {
    const inj = openInjury(me.id);
    if (inj) return `<div class="hurtbox"><div class="status">🤕 You're on the injury list${inj.note ? ` (${esc(inj.note)})` : ''}${inj.back_by ? `, back by ${esc(pretty(inj.back_by))}` : ''}. Your Tuesdays don't count against you.</div>
      <button class="btn small in" data-act="healed">I'm back 💪</button></div>`;
    if (!hurtForm) return `<div class="hurtbox"><button class="link" data-act="hurt">Hurt? Put yourself on the injury list 🤕</button></div>`;
    return `<div class="hurtbox">
      <div class="me-row"><label class="l" for="hurtNote">What happened?</label><input id="hurtNote" maxlength="60" placeholder="Ankle, back, knee…"></div>
      <div class="me-row"><label class="l" for="hurtBack">Back by (if you know)</label><input id="hurtBack" type="date" min="${ymd(new Date())}"></div>
      <div class="me-row"><button class="btn small out" data-act="hurtgo">Put me on the list</button><button class="link" data-act="hurtcancel">Cancel</button></div></div>`;
  }

  function renderInjuries() {
    const list = injuries.filter(x => !x.healed_on).map(x => ({ ...x, p: players.find(p => p.id === x.player_id) })).filter(x => x.p).sort((a, b) => a.since.localeCompare(b.since));
    const weeks = (d) => { const n = Math.floor((parse(ymd(new Date())) - parse(d)) / (7 * 864e5)); return n < 1 ? 'this week' : n === 1 ? '1 week' : n + ' weeks'; };
    $('#ir').innerHTML = list.map(x => `<li><span class="x">🤕</span><span class="n">${esc(x.p.name)}</span>
      <span class="w">${x.note ? `<b>${esc(x.note)}</b> · ` : ''}Out ${weeks(x.since)}${x.back_by ? ` · back by ${esc(pretty(x.back_by))}` : ' · return unknown'}</span></li>`).join('')
      || '<li style="transform:none;grid-template-columns:auto 1fr"><span class="x">💪</span><span class="n">Nobody hurt</span><span class="w">Full squad. Stay healthy!</span></li>';
  }

  async function reportInjury() {
    const note = ($('#hurtNote').value || '').trim().replace(/\s+/g, ' ').slice(0, 60) || null;
    const back_by = $('#hurtBack').value || null;
    const { data, error } = await sb.from('hoops_injuries').insert({ player_id: meId, note, back_by, since: ymd(new Date()) }).select('id,player_id,note,back_by,since,healed_on').single();
    if (error) { toast('Could not save. Try again'); return; }
    injuries.push(data); hurtForm = false; render(); toast('Get well soon 🩹');
  }

  async function healed() {
    const inj = openInjury(meId); if (!inj) return;
    const today = ymd(new Date());
    const { error } = await sb.from('hoops_injuries').update({ healed_on: today }).eq('id', inj.id);
    if (error) { toast('Could not save. Try again'); return; }
    inj.healed_on = today; render(); boo('I’M BACK! 💪', 'yeah');
  }

  function stats() {
    const today = new Date();
    const lastPlayed = (() => { const g = nextGame(today); const d = parse(g); return ymd(new Date(d.getTime() - 7 * 864e5)); })();
    const birds = {};
    [...new Set(checkins.map(c => c.game_date))].filter(d => d <= GAME).forEach(d => { const b = earlyBird(d); if (b) birds[b] = (birds[b] || 0) + 1; });
    return players.map(p => {
      const since = ymd(new Date(p.created_at));
      const possible = tuesdaysBetween(since, lastPlayed).filter(d => statusFor(p.id, d) === 'in' || !injuredOn(p.id, d));
      const played = checkins.filter(c => c.player_id === p.id && c.status === 'in' && c.game_date <= lastPlayed).length;
      const missed = possible.filter(d => statusFor(p.id, d) !== 'in').length;
      const silent = possible.filter(d => !statusFor(p.id, d)).length;
      let streak = 0; for (let i = possible.length - 1; i >= 0 && statusFor(p.id, possible[i]) === 'in'; i--) streak++;
      let best = 0, run = 0; possible.forEach(d => { run = statusFor(p.id, d) === 'in' ? run + 1 : 0; best = Math.max(best, run); });
      return { ...p, early: birds[p.id] || 0, possible: possible.length, played, missed, silent, streak, best, rate: possible.length ? played / possible.length : null };
    });
  }

  function renderBoard() {
    const st = stats().sort((a, b) => b.played - a.played || (b.rate ?? -1) - (a.rate ?? -1) || a.name.localeCompare(b.name));
    if (!st.length) { $('#board').innerHTML = ''; $('#badges').innerHTML = '<p class="empty">The board fills up after the first Tuesday.</p>'; return; }
    const ranked = st.filter(s => s.possible > 0);
    const leaders = (key, pool = ranked) => { const m = Math.max(0, ...pool.map(s => s[key])); return m ? pool.filter(s => s[key] === m).sort((a, b) => a.name.localeCompare(b.name)) : []; };
    const names = (arr) => arr.length < 2 ? arr[0].name : arr.slice(0, -1).map(s => s.name).join(', ') + ' & ' + arr[arr.length - 1].name;
    const tie = (arr) => arr.length > 1 ? ` · ${arr.length}-way tie` : '';
    const birdsTop = leaders('early', st), mvps = leaders('played'), hots = leaders('streak'), recs = leaders('best');
    const same = (a, b) => a.length === b.length && a.every((s, i) => s.id === b[i].id);
    const ghosts = ranked.filter(s => s.possible >= 2).sort((a, b) => a.rate - b.rate || b.missed - a.missed);
    const ghost = ghosts[0] && !mvps.includes(ghosts[0]) && ghosts[0].rate < 0.5 ? ghosts[0] : null;
    const card = (cls, k, who, why) => `<div class="badge ${cls}"><div class="k">${k}</div><div class="who">${esc(who)}</div><div class="why">${why}</div></div>`;
    $('#badges').innerHTML =
      (mvps.length ? card('mvp', '🏆 High score · most runs' + tie(mvps), names(mvps), `${mvps[0].played} run${mvps[0].played === 1 ? "" : "s"} ${mvps.length > 1 ? "each" : "all time"}`) : '') +
      (hots.length && hots[0].streak > 1 ? card('hot', '🔥 On fire · current streak' + tie(hots), names(hots), `${hots[0].streak} Tuesdays in a row and counting`) : '') +
      (recs.length && recs[0].best > 1 && !(same(recs, hots) && recs[0].best === hots[0].streak) ? card('rec', '⚡ Record streak' + tie(recs), names(recs), `${recs[0].best} Tuesdays in a row`) : '') +
      (birdsTop.length ? card('early', '🐓 Early bird · first to check in' + tie(birdsTop), names(birdsTop), `First in ${birdsTop[0].early} time${birdsTop[0].early === 1 ? '' : 's'}${birdsTop.length > 1 ? ' each' : ''}`) : '') +
      (ghost ? card('ghost', '👻 Ghost of the court', ghost.name, `Showed up ${ghost.played} of ${ghost.possible} Tuesdays`) : '');
    $('#board').innerHTML = `<thead><tr><th>#</th><th>Baller</th><th class="n">Runs</th><th class="n">Streak</th><th class="n">Best</th><th class="n">Rate</th><th class="n" title="Times first to check in">🐓</th></tr></thead><tbody>` +
      st.map((s, i) => `<tr><td class="rank">${i + 1}</td><td>${s.streak >= 5 ? `<span class="fire" title="On fire: ${s.streak} in a row">🔥 ${esc(s.name)}</span>` : esc(s.name)}<div class="bar"><i style="width:${Math.round((s.rate || 0) * 100)}%"></i></div></td>
        <td class="n">${s.played}</td><td class="n">${s.streak ? s.streak + (s.streak > 2 ? '🔥' : '') : '·'}</td><td class="n">${s.best || '·'}</td><td class="n">${s.rate == null ? 'New' : Math.round(s.rate * 100) + '%'}</td><td class="n">${s.early || '·'}</td></tr>`).join('') + '</tbody>';
  }

  function renderHistory() {
    const dates = [...new Set(checkins.map(c => c.game_date))].filter(d => d < GAME).sort().reverse().slice(0, 12);
    $('#history').innerHTML = dates.map(d => {
      const who = checkins.filter(c => c.game_date === d && c.status === 'in').map(c => (players.find(p => p.id === c.player_id) || {}).name).filter(Boolean).sort();
      return `<li><span class="d">${esc(pretty(d, { day: 'numeric', month: 'short', year: '2-digit' }))}</span><span class="c">${who.length}</span><span>${who.length ? esc(who.join(', ')) : 'Nobody checked in'}</span></li>`;
    }).join('') || '<li class="empty">No runs on the books yet.</li>';
  }

  function gameOn() {
    document.querySelector('.confetti')?.remove();
    const box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
    const colors = ['var(--teal)', 'var(--gold)', 'var(--red)', 'var(--purple)', 'var(--white)'];
    for (let i = 0; i < 120; i++) {
      const c = document.createElement('i');
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.setProperty('--dx', (Math.random() * 40 - 20) + 'vw');
      c.style.setProperty('--rot', (Math.random() * 1440 - 720) + 'deg');
      c.style.animationDuration = 2.2 + Math.random() * 2 + 's';
      c.style.animationDelay = Math.random() * .8 + 's';
      box.appendChild(c);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 5200);
    boo('GAME ON! 🔥', 'yeah');
  }

  function tick() {
    const el = $('#countdown'); if (!el) return;
    const [y, m, d] = GAME.split('-').map(Number);
    const tip = new Date(y, m - 1, d, 20, 0, 0), ms = tip - new Date();
    if (ms <= 0) { el.className = 'countdown live'; el.innerHTML = 'Game time! 🏀<small>Get to the court</small>'; return; }
    const sec = Math.floor(ms / 1000), dd = Math.floor(sec / 86400), hh = Math.floor(sec % 86400 / 3600), mm = Math.floor(sec % 3600 / 60), ss = sec % 60;
    const pad = n => String(n).padStart(2, '0');
    el.className = 'countdown ' + (ms < 30 * 6e4 ? 'panic' : ms < 3 * 36e5 ? 'hot' : ms < 24 * 36e5 ? 'soon' : '');
    el.innerHTML = `${dd ? dd + 'd ' : ''}${pad(hh)}:${pad(mm)}:${pad(ss)}<small>${ms < 30 * 6e4 ? 'Lace up! Tip-off any second' : ms < 3 * 36e5 ? 'Tip-off is close' : 'Until tip-off'}</small>`;
  }

  function boo(text = 'BOOOHHHH…', cls = '') {
    document.querySelector('.boo')?.remove();
    const el = document.createElement('div');
    el.className = ('boo ' + cls).trim(); el.setAttribute('aria-hidden', 'true');
    el.innerHTML = `<span>${text}</span>`;
    document.body.appendChild(el);
    el.firstChild.addEventListener('animationend', () => el.remove());
  }

  async function setStatus(status) {
    if (status === 'out') boo();
    if (status === 'in') boo('YEAH BALLER!', 'yeah');
    if (status === 'in' && statusFor(meId, GAME) === 'in') { toast('Already in! 🏀'); return; }
    const prev = checkins.slice();
    const i = checkins.findIndex(c => c.player_id === meId && c.game_date === GAME);
    const now = new Date().toISOString();
    if (i >= 0) checkins[i] = { ...checkins[i], status, updated_at: now }; else checkins.push({ player_id: meId, game_date: GAME, status, updated_at: now });
    render();
    const { error } = await sb.from('hoops_checkins').upsert({ player_id: meId, game_date: GAME, status, updated_at: now }, { onConflict: 'player_id,game_date' });
    if (error) { checkins = prev; render(); toast('Could not save. Try again'); return; }
    toast(status === 'in' ? 'You’re in! 🏀' : status === 'maybe' ? 'Maybe it is 🥸' : 'Got it. Next time!');
  }

  async function join() {
    const name = $('#newName').value.trim().replace(/\s+/g, ' ');
    if (!name) { $('#newName').focus(); return; }
    if (players.some(p => p.name.toLowerCase() === name.toLowerCase())) { toast('That name is taken'); return; }
    const { data, error } = await sb.from('hoops_players').insert({ name }).select('id,name,created_at').single();
    if (error) { toast('Could not join. Try again'); return; }
    players.push(data); players.sort((a, b) => a.name.localeCompare(b.name));
    meId = data.id; try { localStorage.setItem(ME_KEY, meId); } catch (e) {}
    render(); toast(`Welcome, ${name}!`);
  }

  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act === 'in' || act === 'out') setStatus(act);
    if (act === 'join') join();
    if (act === 'hurt') { hurtForm = true; renderMe(); $('#hurtNote')?.focus(); }
    if (act === 'hurtcancel') { hurtForm = false; renderMe(); }
    if (act === 'hurtgo') reportInjury();
    if (act === 'healed') healed();
    if (act === 'pick') { const v = $('#pick').value; if (!v) return; meId = v; try { localStorage.setItem(ME_KEY, v); } catch (e) {} render(); }
    if (act === 'switch') { meId = null; try { localStorage.removeItem(ME_KEY); } catch (e) {} render(); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'newName') join(); });

  function fail(err) {
    console.error(err);
    const missing = /relation|does not exist|schema cache/i.test(err && err.message || '');
    $('#notice').innerHTML = `<div class="notice">${missing ? 'The court isn’t built yet: the database tables are missing. Run the setup SQL in Supabase once, then reload.' : 'Can’t reach the court right now. Check your connection and reload.'}</div>`;
    $('#verdict').className = 'verdict off'; $('#verdict').textContent = 'Offline';
    const why = document.createElement('div'); why.style.cssText = 'margin-top:8px;font-size:13px;opacity:.85'; why.textContent = 'Details: ' + ((err && err.message) || err);
    $('#notice .notice').appendChild(why);
    render();
  }

  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    tick(); setInterval(tick, 1000);
    load().catch(fail);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load().catch(() => {}); });
    setInterval(() => { if (!document.hidden && meId && !document.activeElement?.matches('input, select')) load().catch(() => {}); }, 30000);
  } catch (err) { fail(err); }
})();
</script>
</body>
</html>
